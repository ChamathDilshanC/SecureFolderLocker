name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\SecureFolderLocker.sln

      - name: Build
        run: dotnet build .\SecureFolderLocker.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\SecureFolderLocker.sln --configuration Release --no-build
